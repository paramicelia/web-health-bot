<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Web Health Bot — Live Viewer</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1f232c;
    --border: #2a2e38;
    --text: #e7e9ee;
    --muted: #8b9099;
    --dim: #5c626d;
    --pass: #22c55e;
    --warn: #f59e0b;
    --fail: #ef4444;
    --accent: #3b82f6;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 2rem 1.5rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.9rem; }
  .badge { background: var(--panel2); padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.8rem; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .input-section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  .input-section .label { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; display: flex; justify-content: space-between; align-items: center; }
  textarea {
    width: 100%; min-height: 140px; resize: vertical;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 0.65rem 0.8rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.85rem;
    outline: none; transition: border-color 120ms;
  }
  textarea:focus { border-color: var(--accent); }
  .controls { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; flex-wrap: wrap; }
  .btn {
    background: var(--accent); color: white; border: none;
    padding: 0.55rem 1.2rem; border-radius: 6px;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    font-family: inherit;
    transition: background 120ms;
  }
  .btn:hover:not(:disabled) { background: #2563eb; }
  .btn:disabled { background: #2a2e38; cursor: not-allowed; color: var(--dim); }
  .btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover:not(:disabled) { background: #262a34; }
  .progress { color: var(--muted); font-size: 0.85rem; margin-left: auto; font-family: ui-monospace, monospace; }

  .summary { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: stretch; margin-bottom: 1.5rem; }
  .summary .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.6rem 0.9rem; flex: 1 1 130px; min-width: 130px;
  }
  .stat .num { font-size: 1.4rem; font-weight: 600; line-height: 1.2; }
  .stat .lab { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat.ok .num { color: var(--pass); }
  .stat.warn .num { color: var(--warn); }
  .stat.fail .num { color: var(--fail); }

  .results { display: flex; flex-direction: column; gap: 0.75rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 8px;
    padding: 1rem 1.25rem;
    display: grid;
    grid-template-columns: 1fr auto 200px;
    gap: 1rem;
    align-items: start;
  }
  .card.ok { border-left-color: var(--pass); }
  .card.warn { border-left-color: var(--warn); }
  .card.fail { border-left-color: var(--fail); }
  .card.loading { border-left-color: var(--accent); opacity: 0.6; }

  .card .url { font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; }
  .card .reason { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }

  .meta { display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end; min-width: 130px; }
  .status-badge { padding: 0.15rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; }
  .status-badge.ok { background: rgba(34,197,94,0.15); color: var(--pass); }
  .status-badge.warn { background: rgba(245,158,11,0.15); color: var(--warn); }
  .status-badge.fail { background: rgba(239,68,68,0.15); color: var(--fail); }
  .status-badge.loading { background: rgba(59,130,246,0.15); color: var(--accent); }
  .meta .small { font-size: 0.75rem; color: var(--muted); font-family: ui-monospace, monospace; }
  .llm-pill { background: var(--panel2); border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.7rem; color: var(--muted); }
  .llm-pill.yes { color: var(--accent); border-color: rgba(59,130,246,0.4); }

  .thumb { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; height: 140px; display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .thumb.empty { color: var(--dim); font-size: 0.75rem; }

  details.findings { grid-column: 1 / -1; margin-top: 0.5rem; font-size: 0.8rem; }
  details.findings summary { cursor: pointer; color: var(--muted); user-select: none; padding: 0.3rem 0; }
  details.findings summary:hover { color: var(--text); }
  .finding-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  .finding-table th, .finding-table td { padding: 0.35rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border); }
  .finding-table th { color: var(--muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .finding-table td.layer { color: var(--muted); font-family: ui-monospace, monospace; font-size: 0.75rem; }
  .finding-table .sev-ok { color: var(--pass); font-weight: 600; }
  .finding-table .sev-warn { color: var(--warn); font-weight: 600; }
  .finding-table .sev-fail { color: var(--fail); font-weight: 600; }
  .finding-table .vision-row { background: rgba(59,130,246,0.04); }

  .hint { text-align: center; color: var(--dim); padding: 3rem 1rem; font-size: 0.9rem; background: var(--panel); border: 1px dashed var(--border); border-radius: 8px; }

  .error-banner { color: var(--fail); padding: 0.6rem 1rem; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }

  @media (max-width: 800px) {
    .card { grid-template-columns: 1fr; }
    .meta { align-items: flex-start; }
    .thumb { width: 100%; height: 100px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Web Health Bot</h1>
      <div class="sub">Walks each URL, runs deterministic checks first; the vision LLM is called only on ambiguity.</div>
    </div>
    <div class="badge" id="backend">loading…</div>
  </header>

  <section class="input-section">
    <div class="label">
      <span>Targets — one URL per line</span>
      <span class="small" id="target-count" style="color:var(--dim)"></span>
    </div>
    <textarea id="targets" placeholder="https://example.com&#10;https://httpbin.org/status/500"></textarea>
    <div class="controls">
      <button class="btn" id="run">Run health check ▸</button>
      <button class="btn secondary" id="reload">Load defaults</button>
      <button class="btn secondary" id="clear">Clear results</button>
      <span class="progress" id="progress"></span>
    </div>
  </section>

  <div id="error" style="display:none" class="error-banner"></div>

  <div id="summary" class="summary" style="display:none"></div>

  <div id="results" class="results">
    <div class="hint">
      Load defaults or paste your own URLs above, then click <strong>Run health check</strong>.
      Each URL becomes a status card as it completes.
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // --- backend badge ----------------------------------------------------
  fetch("/health").then(r => r.json()).then(h => {
    $("backend").textContent = `backend: ${h.vision_backend} · headless: ${h.headless}`;
  }).catch(() => { $("backend").textContent = "backend: offline"; });

  // --- defaults ---------------------------------------------------------
  async function loadDefaults() {
    try {
      const r = await fetch("/targets");
      const d = await r.json();
      const urls = d.items.map(i => i.url);
      $("targets").value = urls.join("\n");
      updateCount();
    } catch (e) {
      console.error(e);
    }
  }
  $("reload").onclick = loadDefaults;
  loadDefaults();

  // --- count counter ----------------------------------------------------
  function updateCount() {
    const lines = $("targets").value.split("\n").map(s => s.trim()).filter(Boolean);
    $("target-count").textContent = `${lines.length} URL(s)`;
  }
  $("targets").addEventListener("input", updateCount);

  // --- clear ------------------------------------------------------------
  $("clear").onclick = () => {
    $("results").innerHTML = '<div class="hint">Cleared. Click <strong>Run health check</strong> to start a new run.</div>';
    $("summary").style.display = "none";
    $("summary").innerHTML = "";
    $("error").style.display = "none";
  };

  // --- run --------------------------------------------------------------
  $("run").onclick = async () => {
    const urls = $("targets").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (urls.length === 0) return;

    $("run").disabled = true; $("reload").disabled = true;
    $("error").style.display = "none";
    $("results").innerHTML = "";
    $("summary").style.display = "none";
    $("summary").innerHTML = "";

    const totals = { ok: 0, warn: 0, fail: 0, llm_calls: 0 };

    for (let i = 0; i < urls.length; i++) {
      const url = urls[i];
      $("progress").textContent = `Checking ${i + 1} / ${urls.length}: ${url.slice(0, 50)}${url.length > 50 ? "…" : ""}`;
      const placeholderId = renderLoading(url);

      try {
        const t0 = performance.now();
        const r = await fetch("/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const elapsed = Math.round(performance.now() - t0);
        if (!r.ok) {
          const txt = await r.text();
          throw new Error(`HTTP ${r.status}: ${txt.slice(0, 200)}`);
        }
        const report = await r.json();
        replaceCard(placeholderId, renderCard(report, elapsed));
        totals[report.overall] = (totals[report.overall] || 0) + 1;
        if (report.needed_llm) totals.llm_calls += 1;
      } catch (e) {
        replaceCard(placeholderId, renderError(url, e.message));
        totals.fail += 1;
      }
    }

    $("progress").textContent = `Done — ${urls.length} URL(s) in queue.`;
    $("run").disabled = false; $("reload").disabled = false;

    renderSummary(urls.length, totals);
  };

  // --- rendering --------------------------------------------------------
  function renderLoading(url) {
    const id = "card-" + Math.random().toString(36).slice(2, 9);
    const html = `
      <div class="card loading" id="${id}">
        <div>
          <div class="url">${esc(url)}</div>
          <div class="reason">Probing…</div>
        </div>
        <div class="meta"><span class="status-badge loading">RUNNING</span></div>
        <div class="thumb empty">no screenshot yet</div>
      </div>`;
    $("results").insertAdjacentHTML("beforeend", html);
    return id;
  }

  function renderCard(report, clientMs) {
    const sev = report.overall;
    const screenshot = report.screenshot_path
      ? `/artifacts/${encodeURIComponent(report.screenshot_path.split(/[/\\]/).pop())}`
      : null;

    const findingsRows = (report.findings || []).map(f => `
      <tr class="${f.layer === 'vision' ? 'vision-row' : ''}">
        <td class="layer">${esc(f.layer)}</td>
        <td><span class="sev-${f.severity}">${f.severity.toUpperCase()}</span></td>
        <td>${esc(f.message)}</td>
      </tr>
    `).join("");

    return `
      <div class="card ${sev}">
        <div>
          <div class="url"><a href="${esc(report.url)}" target="_blank" style="color:inherit">${esc(report.url)}</a></div>
          <div class="reason">${esc(report.reason)}</div>
        </div>
        <div class="meta">
          <span class="status-badge ${sev}">${sev.toUpperCase()}</span>
          <span class="small">${report.latency_ms} ms · client ${clientMs} ms</span>
          <span class="llm-pill ${report.needed_llm ? 'yes' : ''}">${report.needed_llm ? 'LLM ✓' : 'LLM skipped'}</span>
        </div>
        <div class="thumb">
          ${screenshot ? `<img src="${screenshot}" alt="screenshot of ${esc(report.url)}">` : '<span>no screenshot</span>'}
        </div>
        <details class="findings">
          <summary>${(report.findings || []).length} finding(s)</summary>
          <table class="finding-table">
            <thead><tr><th>layer</th><th>severity</th><th>message</th></tr></thead>
            <tbody>${findingsRows}</tbody>
          </table>
        </details>
      </div>`;
  }

  function renderError(url, msg) {
    return `
      <div class="card fail">
        <div>
          <div class="url">${esc(url)}</div>
          <div class="reason">Probe failed: ${esc(msg)}</div>
        </div>
        <div class="meta"><span class="status-badge fail">ERROR</span></div>
        <div class="thumb empty">—</div>
      </div>`;
  }

  function replaceCard(id, html) {
    const el = document.getElementById(id);
    if (el) el.outerHTML = html;
  }

  function renderSummary(total, t) {
    const saved = total - t.llm_calls;
    $("summary").style.display = "flex";
    $("summary").innerHTML = `
      <div class="stat"><div class="lab">total</div><div class="num">${total}</div></div>
      <div class="stat ok"><div class="lab">ok</div><div class="num">${t.ok || 0}</div></div>
      <div class="stat warn"><div class="lab">warn</div><div class="num">${t.warn || 0}</div></div>
      <div class="stat fail"><div class="lab">fail</div><div class="num">${t.fail || 0}</div></div>
      <div class="stat"><div class="lab">LLM calls</div><div class="num">${t.llm_calls}</div></div>
      <div class="stat"><div class="lab">saved by short-circuit</div><div class="num">${saved}</div></div>
    `;
  }
})();
</script>
</body>
</html>
